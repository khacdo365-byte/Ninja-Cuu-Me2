name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        shell: bash
        run: |
          set -e
          ZIP="Ninja_Cuu_Me_AndroidReady_FIXED.zip"
          test -s "$ZIP"
          echo "ZIP OK"
          ls -lh "$ZIP"
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | head -80

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -d "$HOME/android-sdk" ]; then
            SDK="$HOME/android-sdk"
          fi

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf game extracted build
          mkdir -p game extracted build

          unzip -q Ninja_Cuu_Me_AndroidReady_FIXED.zip -d extracted

          PROJECT_FILE="$(find extracted -name project.godot -type f -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found in ZIP"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. game/

          test -s game/project.godot
          test -f game/export_presets.cfg

          echo "Project and export preset found."

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          godot \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE/game" \
            --quit >/tmp/godot-init.log 2>&1 || true

          cat /tmp/godot-init.log || true

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          rm -f "$KEYSTORE"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s "$KEYSTORE"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          echo "Debug keystore ready: $KEYSTORE"

      - name: Validate Godot Android preset
        shell: bash
        run: |
          set -e

          grep -n '^\[preset\.0\]' game/export_presets.cfg
          grep -n '^name="Android"' game/export_presets.cfg
          grep -n '^platform="Android"' game/export_presets.cfg

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --editor \
            --quit >/tmp/godot-validate.log 2>&1 || {
              cat /tmp/godot-validate.log
              exit 1
            }

          cat /tmp/godot-validate.log || true

      - name: Export debug APK
        shell: bash
        run: |
          set -e

          mkdir -p build
          rm -f build/Ninja-Cuu-Me.apk

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "=== BUILD OUTPUT ==="

          find build \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n'

          test -s build/Ninja-Cuu-Me.apk

          file build/Ninja-Cuu-Me.apk
          ls -lh build/Ninja-Cuu-Me.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 7
