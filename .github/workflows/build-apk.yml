name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract game
        shell: bash
        run: |
          rm -rf game build

          mkdir -p game
          mkdir -p build

          unzip -o Ninja_Cuu_Me_AndroidReady.zip -d game

          test -f game/project.godot

          echo "===== GAME FILES ====="
          ls -la game

          echo "===== ORIGINAL EXPORT PRESET ====="
          test -f game/export_presets.cfg
          cat game/export_presets.cfg

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Check Android preset
        shell: bash
        run: |
          cd game

          echo "===== GODOT VERSION ====="
          godot --version

          echo "===== ANDROID PRESETS ====="
          grep -n 'platform="Android"' export_presets.cfg || true

          echo "===== PRESET NAMES ====="
          grep -n '^name=' export_presets.cfg || true

          echo "===== EXPORT PATHS ====="
          grep -n 'export_path=' export_presets.cfg || true

          echo "===== ANDROID OPTIONS ====="
          grep -n 'architectures/' export_presets.cfg || true

          echo "===== PACKAGE ====="
          grep -n 'package/' export_presets.cfg || true

      - name: Import Godot project
        shell: bash
        run: |
          cd game

          godot \
            --headless \
            --editor \
            --quit-after 10

      - name: Verify Android templates
        shell: bash
        run: |
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"

          echo "===== EXPORT TEMPLATES ====="

          find "$TEMPLATE_ROOT" \
            -type f \
            \( \
              -name "android_debug.apk" \
              -o -name "android_release.apk" \
            \) \
            -print 2>/dev/null || true

          DEBUG_TEMPLATE="$(find "$TEMPLATE_ROOT" \
            -type f \
            -name "android_debug.apk" \
            2>/dev/null | head -n 1)"

          RELEASE_TEMPLATE="$(find "$TEMPLATE_ROOT" \
            -type f \
            -name "android_release.apk" \
            2>/dev/null | head -n 1)"

          if [ -z "$DEBUG_TEMPLATE" ]; then
            echo "ERROR: android_debug.apk not found."
            exit 1
          fi

          if [ -z "$RELEASE_TEMPLATE" ]; then
            echo "ERROR: android_release.apk not found."
            exit 1
          fi

          echo "DEBUG TEMPLATE:"
          echo "$DEBUG_TEMPLATE"

          echo "RELEASE TEMPLATE:"
          echo "$RELEASE_TEMPLATE"

      - name: Check export configuration
        shell: bash
        run: |
          cd game

          echo "===== GODOT EXPORT LIST ====="

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/test.apk" \
            --verbose 2>&1 | head -120 || true

      - name: Export debug APK
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          cd game

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "===== APK ====="

          test -f "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          ls -lh "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
