name: Build Ninja Cuu Me APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 4 -type d | head -100
            exit 1
          fi

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "Found sdkmanager: $SDKMANAGER"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract game project
        shell: bash
        run: |
          rm -rf game build
          mkdir -p game build

          unzip -o Ninja_Cuu_Me_AndroidReady.zip -d game

          echo "Checking Godot project..."

          test -f game/project.godot

          echo "Project found:"
          ls -la game

      - name: Create Android export preset
        shell: bash
        run: |
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/Ninja-Cuu-Me.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.ninjacuume.game"
          package/name="Ninja Cuu Me"
          package/signed=true
          package/app_category=2

          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""

          graphics/opengl_debug=false

          xr_features/xr_mode=0

          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          screen/orientation=1

          one_click_deploy/clear_previous_install=false

          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          permissions/custom_permissions=PackedStringArray()
          EOF

          echo "===== export_presets.cfg ====="
          cat game/export_presets.cfg

      - name: Verify Godot project
        shell: bash
        run: |
          cd game

          echo "===== Godot version ====="
          godot --version

          echo "===== Project ====="
          grep -n "config/name" project.godot || true

          echo "===== Export preset ====="
          grep -n "name=\"Android\"" export_presets.cfg

          echo "===== Android architecture ====="
          grep -n "architectures/arm64-v8a" export_presets.cfg

          echo "===== Portrait ====="
          grep -n "screen/orientation" export_presets.cfg

      - name: Import Godot project
        shell: bash
        run: |
          cd game

          godot \
            --headless \
            --editor \
            --quit-after 10

      - name: Check Android export availability
        shell: bash
        run: |
          cd game

          echo "Checking Android export preset..."

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            ../build/test-Ninja-Cuu-Me.apk \
            2>&1 | tee ../build/export-test.log || true

          echo "===== Export test log ====="
          cat ../build/export-test.log

      - name: Export debug APK
        shell: bash
        run: |
          rm -f build/Ninja-Cuu-Me.apk

          cd game

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            ../build/Ninja-Cuu-Me.apk

          echo "===== APK result ====="

          test -f ../build/Ninja-Cuu-Me.apk

          ls -lh ../build/Ninja-Cuu-Me.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
