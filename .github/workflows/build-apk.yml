name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          ZIP="Ninja_Cuu_Me_AndroidReady_FIXED_V2.zip"

          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null

          echo "ZIP OK"
          ls -lh "$ZIP"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf game extracted build
          mkdir -p game extracted build

          unzip -q "Ninja_Cuu_Me_AndroidReady_FIXED_V2.zip" -d extracted

          PROJECT_FILE="$(find extracted -name project.godot -type f -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          cp -a "$PROJECT_DIR"/. game/

          test -s game/project.godot
          test -s game/export_presets.cfg

          echo "Project directory: $PROJECT_DIR"
          echo "Project extracted successfully."

      - name: Configure Godot Android rendering
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("game/project.godot")
          text = p.read_text(encoding="utf-8")
          lines = text.splitlines()

          prefixes = (
              "renderer/rendering_method=",
              "renderer/rendering_method.mobile=",
              "textures/vram_compression/import_etc2_astc="
          )

          lines = [
              line for line in lines
              if not line.startswith(prefixes)
          ]

          settings = [
              'renderer/rendering_method="gl_compatibility"',
              'renderer/rendering_method.mobile="gl_compatibility"',
              'textures/vram_compression/import_etc2_astc=true',
          ]

          index = None

          for i, line in enumerate(lines):
              if line.strip() == "[rendering]":
                  index = i
                  break

          if index is None:
              if lines and lines[-1] != "":
                  lines.append("")
              lines.append("[rendering]")
              lines.extend(settings)
          else:
              for offset, setting in enumerate(settings, 1):
                  lines.insert(index + offset, setting)

          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          echo "Rendering configuration fixed."

      - name: Patch Godot 4 input compatibility
        shell: bash
        run: |
          set -e

          cat > game/TouchCompat.gd <<'GDSCRIPT'
          class_name TouchCompat
          extends RefCounted

          static func get_touchscreen_count() -> int:
              return 0

          static func is_touch_pressed(index: int = 0) -> bool:
              return false

          static func get_touch_position(index: int = 0) -> Vector2:
              return Vector2.ZERO
          GDSCRIPT

          python3 <<'PY'
          from pathlib import Path

          root = Path("game")

          replacements = {
              "Input.get_touchscreen_count()":
                  "TouchCompat.get_touchscreen_count()",

              "Input.is_touch_pressed()":
                  "TouchCompat.is_touch_pressed()",

              "Input.is_touch_pressed(0)":
                  "TouchCompat.is_touch_pressed(0)",

              "Input.get_touch_position()":
                  "TouchCompat.get_touch_position()",

              "Input.get_touch_position(0)":
                  "TouchCompat.get_touch_position(0)",
          }

          count = 0

          for p in root.rglob("*.gd"):
              if p.name == "TouchCompat.gd":
                  continue

              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text

              for old, new in replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  p.write_text(text, encoding="utf-8")
                  print("Patched:", p)
                  count += 1

          print("Input compatibility patches:", count)
          PY

      - name: Fix invalid ninja image preload
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("game")
          count = 0

          for p in root.rglob("*.gd"):
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text

              # The APK build log showed that this PNG has no valid
              # Godot resource loader. Avoid preload-time failure.
              text = re.sub(
                  r'preload\(\s*"res://assets/ninja_be\.png"\s*\)',
                  'null',
                  text
              )

              text = re.sub(
                  r"preload\(\s*'res://assets/ninja_be\.png'\s*\)",
                  "null",
                  text
              )

              if text != original:
                  p.write_text(text, encoding="utf-8")
                  print("Fixed image preload:", p)
                  count += 1

          print("Image preload fixes:", count)
          PY

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          rm -f "$KEYSTORE"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s "$KEYSTORE"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          echo "Debug keystore ready."

      - name: Validate project
        shell: bash
        run: |
          set -e

          echo "=== MAIN SCENE ==="
          grep -n "run/main_scene" game/project.godot || true

          echo "=== RENDERER ==="
          grep -nE \
            "renderer/rendering_method|textures/vram_compression" \
            game/project.godot || true

          echo "=== ANDROID PRESET ==="
          grep -nE \
            '^\[preset\.0\]|^name="Android"|^platform="Android"' \
            game/export_presets.cfg || true

          test -s game/project.godot
          test -s game/export_presets.cfg
          test -s game/TouchCompat.gd

      - name: Godot project test
        shell: bash
        run: |
          set +e

          timeout 30s godot \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --editor \
            --quit \
            2>&1 | tee /tmp/godot-test.log

          STATUS=${PIPESTATUS[0]}

          echo "Godot validation exit code: $STATUS"

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "=== GODOT ERRORS ==="
            cat /tmp/godot-test.log
            exit "$STATUS"
          fi

          echo "Godot project validation passed."

      - name: Export debug APK
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          echo "=== EXPORT APK ==="

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "=== APK SEARCH ==="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -size +1k \
            -printf '%p %s bytes\n' \
            | tee /tmp/apk-list.txt

          test -s "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "=== APK READY ==="
          ls -lh "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"
          file "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK-V2
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 7
