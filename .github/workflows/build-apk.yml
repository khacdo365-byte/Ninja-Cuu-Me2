name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract game
        run: |
          rm -rf game build
          mkdir -p game build
          unzip -o Ninja_Cuu_Me_AndroidReady.zip -d game
          test -f game/project.godot

      - name: Configure Android
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Android export template
        run: |
          GODOT_VERSION="4.6.3"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          mkdir -p "$TEMPLATE_DIR"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -O /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          find /tmp/godot_templates -type f -exec cp {} "$TEMPLATE_DIR/" \;

          echo "Installed templates:"
          find "$TEMPLATE_DIR" -maxdepth 1 -type f -print

      - name: Create Android preset
        run: |
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Ninja-Cuu-Me.apk"
          patch_list=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.ninjacuume.game"
          package/name="Ninja Cuu Me"
          package/signed=true

          version/code=1
          version/name="1.0"

          screen/orientation=1
          EOF

      - name: Verify
        run: |
          cd game
          godot --version
          test -f project.godot
          test -f export_presets.cfg
          grep 'name="Android"' export_presets.cfg
          grep 'platform="Android"' export_presets.cfg

      - name: Export APK
        run: |
          cd game
          godot --headless --path . \
            --export-debug "Android" \
            ../build/Ninja-Cuu-Me.apk

          test -f ../build/Ninja-Cuu-Me.apk
          ls -lh ../build/Ninja-Cuu-Me.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
