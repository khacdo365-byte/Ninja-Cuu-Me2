name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          ZIP="Ninja_Cuu_Me_AndroidReady_FIXED_V2.zip"

          test -s "$ZIP"
          echo "ZIP OK"
          ls -lh "$ZIP"

          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | head -80

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -d "$HOME/android-sdk" ]; then
            SDK="$HOME/android-sdk"
          fi

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf game extracted build
          mkdir -p game extracted build

          unzip -q Ninja_Cuu_Me_AndroidReady_FIXED_V2.zip -d extracted

          PROJECT_FILE="$(find extracted -name project.godot -type f -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found in ZIP"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. game/

          test -s game/project.godot
          test -f game/export_presets.cfg

          echo "Project and export preset found."

      - name: Verify V2 project
        shell: bash
        run: |
          set -e
