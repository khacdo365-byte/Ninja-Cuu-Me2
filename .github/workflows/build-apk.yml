name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        shell: bash
        run: |
          set -e
          test -f Ninja_Cuu_Me_AndroidReady_FIXED.zip
          echo "ZIP OK"
          ls -lh Ninja_Cuu_Me_AndroidReady_FIXED.zip
          unzip -l Ninja_Cuu_Me_AndroidReady_FIXED.zip | head -80

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -d "$HOME/android-sdk" ]; then
            SDK="$HOME/android-sdk"
          fi

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf game build extracted
          mkdir -p game build extracted

          unzip -q Ninja_Cuu_Me_AndroidReady_FIXED.zip -d extracted

          PROJECT_FILE="$(find extracted -name project.godot -type f -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "Project: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. game/

          test -f game/project.godot

          echo "=== GAME DIRECTORY ==="
          ls -lah game

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$KEYSTORE"

          echo "ANDROID_DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          ls -lh "$KEYSTORE"

      - name: Create Android export preset
        shell: bash
        run: |
          set -e

          cd game

          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          version="1.0"
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="35"
          gradle_build/architectures/armeabi-v7a=false
          gradle_build/architectures/arm64-v8a=true
          gradle_build/architectures/x86=false
          gradle_build/architectures/x86_64=false

          package/unique_name="com.ninja.cuu.me"
          package/name="Ninja Cuu Me"
          package/signed=true
          package/app_category=2
          package/retain_data_on_un
