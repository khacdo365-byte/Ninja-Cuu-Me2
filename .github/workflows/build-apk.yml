name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository files
        shell: bash
        run: |
          echo "=== ROOT ==="
          ls -lah
          echo "=== ZIP ==="
          test -f Ninja_Cuu_Me_AndroidReady_FIXED.zip
          unzip -l Ninja_Cuu_Me_AndroidReady_FIXED.zip | head -40

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract project
        shell: bash
        run: |
          rm -rf game build
          mkdir -p game build
          unzip -q Ninja_Cuu_Me_AndroidReady_FIXED.zip -d game

          if [ ! -f game/project.godot ]; then
            FOUND=$(find game -maxdepth 3 -name project.godot -print -quit)
            if [ -n "$FOUND" ]; then
              ROOT=$(dirname "$FOUND")
              shopt -s dotglob
              cp -a "$ROOT"/* game/
            fi
          fi

          test -f game/project.godot
          test -f game/export_presets.cfg

          echo "Project ready:"
          ls -lah game

      - name: Export APK
        shell: bash
        run: |
          cd game
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --path . \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          test -s "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"
          ls -lh "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
