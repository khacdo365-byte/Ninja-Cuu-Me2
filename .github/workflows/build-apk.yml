name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          ZIP="Ninja_Cuu_Me_AndroidReady_FIXED_V2.zip"

          echo "=== CHECK ZIP ==="
          test -s "$ZIP"
          ls -lh "$ZIP"

          unzip -t "$ZIP" >/dev/null
          echo "ZIP OK"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf game extracted build
          mkdir -p game extracted build

          unzip -q "Ninja_Cuu_Me_AndroidReady_FIXED_V2.zip" -d extracted

          PROJECT_FILE="$(find extracted -name project.godot -type f -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. game/

          test -s game/project.godot
          test -f game/export_presets.cfg

          echo "=== PROJECT FILE ==="
          ls -lah game

      - name: Fix Android render configuration
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("game/project.godot")
          text = p.read_text(encoding="utf-8")

          lines = text.splitlines()

          # Remove existing renderer settings
          remove_prefixes = (
              "renderer/rendering_method=",
              "renderer/rendering_method.mobile=",
              "textures/vram_compression/import_etc2_astc="
          )

          lines = [
              line for line in lines
              if not line.startswith(remove_prefixes)
          ]

          rendering_index = None

          for i, line in enumerate(lines):
              if line.strip() == "[rendering]":
                  rendering_index = i
                  break

          settings = [
              'renderer/rendering_method="gl_compatibility"',
              'renderer/rendering_method.mobile="gl_compatibility"',
              "textures/vram_compression/import_etc2_astc=true",
          ]

          if rendering_index is not None:
              for offset, setting in enumerate(settings, start=1):
                  lines.insert(rendering_index + offset, setting)
          else:
              if lines and lines[-1] != "":
                  lines.append("")

              lines.append("[rendering]")
              lines.extend(settings)

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Godot Android rendering configuration fixed.")
          PY

          echo "=== RENDER SETTINGS ==="
          grep -nE \
            'renderer/rendering_method|textures/vram_compression/import_etc2_astc' \
            game/project.godot || true

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          rm -f "$KEYSTORE"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s "$KEYSTORE"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          echo "Debug keystore ready."

      - name: Validate project
        shell: bash
        run: |
          set -e

          echo "=== PROJECT.GODOT ==="
          grep -nE \
            'run/main_scene|renderer/rendering_method' \
            game/project.godot || true

          echo "=== EXPORT PRESETS ==="
          grep -nE \
            '^\[preset\.0\]|^name="Android"|^platform="Android"' \
            game/export_presets.cfg || true

          test -s game/project.godot
          test -s game/export_presets.cfg

      - name: Godot project test
        shell: bash
        run: |
          set +e

          timeout 30s godot \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --quit-after 5 \
            2>&1 | tee /tmp/godot-test.log

          STATUS=${PIPESTATUS[0]}

          echo "Godot test exit code: $STATUS"

          # timeout 124 is acceptable here because the project may keep
          # running normally instead of exiting immediately.
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "Godot project test failed."
            exit "$STATUS"
          fi

          echo "Godot project test passed."

      - name: Export debug APK
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          echo "=== EXPORT APK ==="

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "=== SEARCH FOR APK ==="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -printf '%p %s bytes\n' \
            | tee /tmp/apk-list.txt

          APK="$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -name "*.apk" \
            -size +1k \
            -print \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            echo "=== BUILD DIRECTORY ==="
            find build -maxdepth 4 -type f -ls || true
            echo "=== GODOT LOG ==="
            cat /tmp/godot-test.log || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          test -s "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "=== FINAL APK ==="
          ls -lh "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"
          file "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK-V2
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 7
