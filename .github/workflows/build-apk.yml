name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Found: $SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract game
        shell: bash
        run: |
          rm -rf game build
          mkdir -p game build

          unzip -o Ninja_Cuu_Me_AndroidReady.zip -d game

          test -f game/project.godot

          echo "===== PROJECT ====="
          ls -la game

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Godot Android SDK configured."

      - name: Install Godot Android export templates
        shell: bash
        run: |
          GODOT_VERSION="4.6.3"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"

          mkdir -p "$TEMPLATE_DIR"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -O /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates

          if [ -d "/tmp/godot_templates/templates" ]; then
            cp -R /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"
          else
            cp -R /tmp/godot_templates/. "$TEMPLATE_DIR/"
          fi

          echo "===== EXPORT TEMPLATES ====="
          find "$TEMPLATE_DIR" -maxdepth 1 -type f -print

      - name: Create Android export preset
        shell: bash
        run: |
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Ninja-Cuu-Me.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.ninjacuume.game"
          package/name="Ninja Cuu Me"

          version/code=1
          version/name="1.0"

          screen/orientation=1
          EOF

          echo "===== EXPORT PRESET ====="
          cat game/export_presets.cfg

      - name: Check Godot project
        shell: bash
        run: |
          cd game

          echo "===== GODOT VERSION ====="
          godot --version

          echo "===== PROJECT ====="
          grep -n "config/name" project.godot || true

          echo "===== PRESET ====="
          grep -n 'name="Android"' export_presets.cfg

          echo "===== PLATFORM ====="
          grep -n 'platform="Android"' export_presets.cfg

          echo "===== ARM64 ====="
          grep -n 'architectures/arm64-v8a=true' export_presets.cfg

          echo "===== ORIENTATION ====="
          grep -n 'screen/orientation=1' export_presets.cfg

      - name: Import project
        shell: bash
        run: |
          cd game

          godot \
            --headless \
            --editor \
            --quit-after 10

      - name: Install Android build template
        shell: bash
        run: |
          cd game

          godot \
            --headless \
            --path . \
            --install-android-build-template

      - name: Export APK
        shell: bash
        run: |
          rm -f build/Ninja-Cuu-Me.apk

          cd game

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            ../build/Ninja-Cuu-Me.apk

          echo "===== APK ====="

          test -f ../build/Ninja-Cuu-Me.apk

          ls -lh ../build/Ninja-Cuu-Me.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
