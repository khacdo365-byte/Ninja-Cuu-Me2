name: Build Ninja Cuu Me APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 4 -type d | head -100
            exit 1
          fi

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "Found sdkmanager: $SDKMANAGER"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract game project
        run: |
          rm -rf game build
          mkdir -p game build
          unzip -o Ninja_Cuu_Me_AndroidReady.zip -d game
          test -f game/project.godot
                - name: Fix Android texture export setting
        shell: bash
        run: |
          if ! grep -q '^textures/vram_compression/import_etc2_astc=true$' game/project.godot; then
            sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' game/project.godot
          fi
          grep -n 'textures/vram_compression/import_etc2_astc' game/project.godot

      - name: Import Godot project
        run: |
          cd game
          godot --headless --editor --quit-after 10 || true

      - name: Export debug APK
        run: |
          cd game
          godot --headless --path . --export-debug "Android" ../build/Ninja-Cuu-Me.apk
          test -f ../build/Ninja-Cuu-Me.apk
          ls -lh ../build/Ninja-Cuu-Me.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
