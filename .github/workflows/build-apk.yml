name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=== ROOT ==="
          ls -lah

          echo "=== CHECK ZIP ==="
          test -f Ninja_Cuu_Me_AndroidReady_FIXED.zip

          echo "ZIP found:"
          ls -lh Ninja_Cuu_Me_AndroidReady_FIXED.zip

          echo "=== ZIP CONTENT ==="
          unzip -l Ninja_Cuu_Me_AndroidReady_FIXED.zip | head -60

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Không dùng android-actions/setup-android ở đây.
      # Runner Ubuntu đã có Android SDK, chỉ cần xác định đúng SDK path.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "$HOME/android-sdk" ]; then
            SDK="$HOME/android-sdk"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK directory was not found."
            exit 1
          fi

          echo "Using Android SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager found:"
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || true
          else
            echo "WARNING: sdkmanager was not found at expected location."
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=== INSTALLED ANDROID PACKAGES ==="
          "$SDKMANAGER" --list_installed | head -100 || true

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf game build
          mkdir -p game build

          unzip -q Ninja_Cuu_Me_AndroidReady_FIXED.zip -d game

          echo "=== SEARCH PROJECT ==="

          PROJECT_FILE="$(find game -maxdepth 5 -name project.godot -type f -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found."
            find game -maxdepth 5 -type f | head -150
            exit 1
          fi

          echo "Found: $PROJECT_FILE"

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ "$PROJECT_DIR" != "game" ]; then
            echo "Project is nested inside: $PROJECT_DIR"

            TEMP_DIR="$(mktemp -d)"

            cp -a "$PROJECT_DIR"/. "$TEMP_DIR"/

            rm -rf game/*

            cp -a "$TEMP_DIR"/. game/

            rm -rf "$TEMP_DIR"
          fi

          test -f game/project.godot
          test -f game/export_presets.cfg

          echo "=== PROJECT ROOT ==="
          ls -lah game

      - name: Configure Godot Android
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "=== GODOT SETTINGS ==="
          cat "$HOME/.config/godot/editor_settings-4.tres"

      # ==========================================================
      # CREATE DEBUG KEYSTORE
      # ==========================================================
      - name: Create Android debug keystore
        shell: bash
        run: |
          set -e

          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE="$KEYSTORE_DIR/debug.keystore"

          mkdir -p "$KEYSTORE_DIR"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$KEYSTORE"

          echo "ANDROID_DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "=== DEBUG KEYSTORE ==="
          ls -lh "$KEYSTORE"

      # ==========================================================
      # FIX ANDROID EXPORT PRESET
      # ==========================================================
      - name: Configure Android export preset
        shell: bash
        run: |
          set -e

          cd game

          echo "=== BEFORE ==="
          grep -n "keystore/" export_presets.cfg || true

          # Debug keystore
          sed -i "s|^keystore/debug=.*|keystore/debug=\"$ANDROID_DEBUG_KEYSTORE\"|" export_presets.cfg
          sed -i 's|^keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|^keystore/debug_password=.*|keystore/debug_password="android"|' export_presets.cfg

          echo "=== AFTER ==="
          grep -n "keystore/" export_presets.cfg || true

          # Kiểm tra bắt buộc
          grep -q 'keystore/debug="' export_presets.cfg
          grep -q 'keystore/debug_user="androiddebugkey"' export_presets.cfg
          grep -q 'keystore/debug_password="android"' export_presets.cfg

          test -f "$ANDROID_DEBUG_KEYSTORE"

      - name: Validate Godot project
        shell: bash
        run: |
          set -e

          cd game

          godot \
            --headless \
            --editor \
            --quit-after 10

      - name: Check Android export configuration
        shell: bash
        run: |
          set -e

          cd game

          echo "=== GODOT ==="
          godot --version

          echo "=== JAVA ==="
          java -version

          echo "=== ANDROID SDK ==="
          echo "$ANDROID_HOME"

          echo "=== ANDROID EXPORT PRESET ==="
          grep -n -A80 -B5 '^\[preset\.' export_presets.cfg || true

          echo "=== KEYSTORE ==="
          ls -lh "$ANDROID_DEBUG_KEYSTORE"

      - name: Export debug APK
        shell: bash
        run: |
          set -e

          cd game

          mkdir -p "$GITHUB_WORKSPACE/build"

          rm -f "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "=== START ANDROID EXPORT ==="

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "=== CHECK APK ==="

          if [ ! -f "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk" ]; then
            echo "ERROR: APK file was not created."
            exit 1
          fi

          if [ ! -s "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk" ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          echo "=== APK CREATED SUCCESSFULLY ==="
          ls -lh "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
