name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository files
        shell: bash
        run: |
          echo "=== ROOT ==="
          ls -lah

          echo "=== ZIP ==="
          test -f Ninja_Cuu_Me_AndroidReady_FIXED.zip

          unzip -l Ninja_Cuu_Me_AndroidReady_FIXED.zip | head -40

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$RUNNER_TOOL_CACHE/android-sdk"
          fi

          echo "Using Android SDK: $ANDROID_HOME"

          mkdir -p "$ANDROID_HOME"

          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager already available"
            sdkmanager --version || true
          else
            echo "sdkmanager not found on PATH"
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract project
        shell: bash
        run: |
          rm -rf game build

          mkdir -p game
          mkdir -p build

          unzip -q Ninja_Cuu_Me_AndroidReady_FIXED.zip -d game

          echo "=== Searching for project.godot ==="

          PROJECT_FILE="$(find game -maxdepth 4 -name project.godot -type f -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found inside ZIP."
            find game -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Found: $PROJECT_FILE"

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ "$PROJECT_DIR" != "game" ]; then
            echo "Project is inside: $PROJECT_DIR"

            mkdir -p game/project_tmp

            shopt -s dotglob
            cp -a "$PROJECT_DIR"/* game/project_tmp/

            rm -rf game/*
            cp -a game/project_tmp/* game/
            rm -rf game/project_tmp
          fi

          echo "=== Project files ==="
          ls -lah game

          test -f game/project.godot
          test -f game/export_presets.cfg

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "Godot Android configuration:"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Validate Godot project
        shell: bash
        run: |
          cd game

          godot \
            --headless \
            --editor \
            --quit-after 10

      - name: Check Android export preset
        shell: bash
        run: |
          cd game

          echo "=== Android export presets ==="

          grep -n "Android" export_presets.cfg || true

          echo "=== Export presets ==="

          cat export_presets.cfg

      - name: Export debug APK
        shell: bash
        run: |
          cd game

          mkdir -p "$GITHUB_WORKSPACE/build"

          rm -f "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          if [ ! -s "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "=== APK CREATED ==="
          ls -lh "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
