name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Extract game
        shell: bash
        run: |
          rm -rf game build
          mkdir -p game build

          unzip -o Ninja_Cuu_Me_AndroidReady.zip -d game

          test -f game/project.godot

          echo "Game extracted successfully."

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Android export preset
        shell: bash
        run: |
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Ninja-Cuu-Me.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.ninjacuume.game"
          package/name="Ninja Cuu Me"

          version/code=1
          version/name="1.0"

          screen/orientation=1
          EOF

      - name: Check Godot
        shell: bash
        run: |
          godot --version

          echo "===== PROJECT ====="
          grep -n "config/name" game/project.godot || true

          echo "===== ANDROID PRESET ====="
          grep -n 'platform="Android"' game/export_presets.cfg

          echo "===== ARM64 ====="
          grep -n 'architectures/arm64-v8a=true' game/export_presets.cfg

      - name: Import Godot project
        shell: bash
        run: |
          cd game

          godot \
            --headless \
            --editor \
            --quit-after 10

      - name: Verify Android export templates
        shell: bash
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates"

          echo "===== EXPORT TEMPLATES ====="
          find "$TEMPLATE_DIR" -maxdepth 3 -type f 2>/dev/null || true

          if ! find "$TEMPLATE_DIR" -type f -name "android_debug.apk" | grep -q .; then
            echo "ERROR: android_debug.apk not found."
            exit 1
          fi

          if ! find "$TEMPLATE_DIR" -type f -name "android_release.apk" | grep -q .; then
            echo "ERROR: android_release.apk not found."
            exit 1
          fi

          echo "Android export templates OK."

      - name: Export APK
        shell: bash
        run: |
          rm -f build/Ninja-Cuu-Me.apk

          godot \
            --headless \
            --path game \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

          echo "===== APK RESULT ====="

          test -f build/Ninja-Cuu-Me.apk

          ls -lh build/Ninja-Cuu-Me.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
