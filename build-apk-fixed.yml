name: Build Ninja Cuu Me APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Prepare project
        shell: bash
        run: |
          rm -rf game build
          mkdir -p build

          if [ -f project.godot ]; then
            echo "Project files are already at repository root."
            mkdir -p game
            cp -a . game/
            rm -rf game/.git game/game game/build
          elif [ -f Ninja_Cuu_Me_AndroidReady_FIXED.zip ]; then
            echo "Project ZIP found; extracting it."
            mkdir -p game
            unzip -o Ninja_Cuu_Me_AndroidReady_FIXED.zip -d game
          else
            echo "ERROR: project.godot and Ninja_Cuu_Me_AndroidReady_FIXED.zip are both missing."
            exit 1
          fi

          test -f game/project.godot
          test -f game/export_presets.cfg
          test -f game/assets/ninja_be.png

      - name: Configure Godot Android
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF2

      - name: Validate Godot project
        shell: bash
        run: |
          cd game
          godot --headless --editor --quit-after 10

      - name: Export debug APK
        shell: bash
        run: |
          cd game
          rm -f "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"
          godot --headless --path . --export-debug "Android" "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"
          test -s "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"
          ls -lh "$GITHUB_WORKSPACE/build/Ninja-Cuu-Me.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Cuu-Me-APK
          path: build/Ninja-Cuu-Me.apk
          if-no-files-found: error
          retention-days: 14
